name: fetch-pages
on:
  push:
    branches:
      - "claude/villa-spanje-search-u2k0f1"
    paths:
      - "villa-zoektocht-spanje/tools/urls.txt"
permissions:
  contents: write
concurrency:
  group: fetch-pages
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        run: python3 villa-zoektocht-spanje/tools/fetch.py
      - name: Commit results
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -A villa-zoektocht-spanje/fetched
          git commit -m "Fetched pages (zoekronde Javea)" || echo "nothing to commit"
          git push
