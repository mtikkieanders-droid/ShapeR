name: fetch-pages
on:
  workflow_dispatch:
    inputs:
      urls:
        description: newline-separated URLs to fetch
        required: true
        type: string
      batch:
        description: batch label
        required: false
        default: b1
        type: string
permissions:
  contents: write
concurrency:
  group: fetch-pages
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pages
        env:
          URLS: ${{ inputs.urls }}
          BATCH: ${{ inputs.batch }}
        run: python3 villa-zoektocht-spanje/tools/fetch.py
      - name: Commit results
        run: |
          git config user.name "fetch-bot"
          git config user.email "fetch-bot@users.noreply.github.com"
          git add -A villa-zoektocht-spanje/fetched
          git commit -m "Fetched pages batch ${BATCH:-b1}" || echo "nothing to commit"
          git push
        env:
          BATCH: ${{ inputs.batch }}
